<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ExpenseTracker v1</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    label { display: block; font-size: 12px; color: #444; }
    input, select { padding: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f6f6f6; }
    .actions button { margin-right: 6px; }
    .error { color: #b00020; font-size: 12px; }
    .card { border: 1px solid #ddd; padding: 12px; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<h1>ExpenseTracker v1</h1>

<div class="card">
  <h3>Add expense</h3>
  <div class="row">
    <div>
      <label>Amount</label>
      <input id="amount" type="number" min="0.01" step="0.01"/>
      <div id="amountErr" class="error"></div>
    </div>
    <div>
      <label>Date</label>
      <input id="date" type="date"/>
      <div id="dateErr" class="error"></div>
    </div>
    <div>
      <label>Category</label>
      <input id="category" maxlength="64" placeholder="e.g., Groceries"/>
      <div id="categoryErr" class="error"></div>
    </div>
    <div style="flex:1; min-width: 220px;">
      <label>Note</label>
      <input id="note" maxlength="255" placeholder="optional" style="width: 100%;"/>
      <div id="noteErr" class="error"></div>
    </div>
  </div>
  <button id="addBtn">Add</button>
  <div id="addFormErr" class="error"></div>
</div>

<div class="card">
  <h3>Filters</h3>
  <div class="row">
    <div>
      <label>From</label>
      <input id="from" type="date"/>
    </div>
    <div>
      <label>To</label>
      <input id="to" type="date"/>
    </div>
    <div>
      <label>Category</label>
      <input id="fCategory" maxlength="64"/>
    </div>
    <div>
      <label>Min amount</label>
      <input id="minAmount" type="number" min="0" step="0.01"/>
    </div>
    <div>
      <label>Max amount</label>
      <input id="maxAmount" type="number" min="0" step="0.01"/>
    </div>
    <div style="flex:1; min-width: 220px;">
      <label>Note contains</label>
      <input id="fNote"/>
    </div>
    <div>
      <label>Sort by</label>
      <select id="sortBy">
        <option value="date">Date</option>
        <option value="amount">Amount</option>
      </select>
    </div>
    <div>
      <label>Order</label>
      <select id="sortOrder">
        <option value="desc">Desc</option>
        <option value="asc">Asc</option>
      </select>
    </div>
  </div>
  <button id="applyFilters">Apply</button>
  <button id="clearFilters">Clear filters</button>
  <button id="exportCsv">Export CSV</button>
</div>

<div class="card">
  <h3>Monthly</h3>
  <div class="row">
    <div>
      <label>Month (YYYY-MM)</label>
      <input id="month" placeholder="2026-07"/>
    </div>
    <div>
      <button id="loadMonthly">Load monthly total</button>
      <button id="loadInsights">Monthly insights</button>
    </div>
  </div>
  <div id="monthlyTotal"></div>
  <div id="insights"></div>
</div>

<div class="card">
  <h3>Budgets</h3>
  <div class="row">
    <div>
      <label>Month (YYYY-MM)</label>
      <input id="bMonth" placeholder="2026-07"/>
    </div>
    <div>
      <label>Category (blank for overall)</label>
      <input id="bCategory" maxlength="64"/>
    </div>
    <div>
      <label>Budget amount</label>
      <input id="bAmount" type="number" min="0.01" step="0.01"/>
    </div>
    <div>
      <button id="saveBudget">Save budget</button>
      <button id="loadBudgetProgress">View progress</button>
    </div>
  </div>
  <div id="budgetResult"></div>
  <div id="budgetProgress"></div>
</div>

<h3>Expenses</h3>
<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Date</th>
    <th>Category</th>
    <th>Amount</th>
    <th>Note</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody id="expenseTbody"></tbody>
</table>

<div id="editModal" class="card hidden">
  <h3>Edit expense</h3>
  <input id="editId" type="hidden"/>
  <div class="row">
    <div>
      <label>Amount</label>
      <input id="editAmount" type="number" min="0.01" step="0.01"/>
      <div id="editAmountErr" class="error"></div>
    </div>
    <div>
      <label>Date</label>
      <input id="editDate" type="date"/>
      <div id="editDateErr" class="error"></div>
    </div>
    <div>
      <label>Category</label>
      <input id="editCategory" maxlength="64"/>
      <div id="editCategoryErr" class="error"></div>
    </div>
    <div style="flex:1; min-width: 220px;">
      <label>Note</label>
      <input id="editNote" maxlength="255" style="width: 100%;"/>
      <div id="editNoteErr" class="error"></div>
    </div>
  </div>
  <button id="saveEdit">Save</button>
  <button id="cancelEdit">Cancel</button>
  <div id="editFormErr" class="error"></div>
</div>

<script>
  const api = {
    list: (q) => fetch('/api/expenses' + q).then(r => r.json()),
    create: (body) => fetch('/api/expenses', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}),
    update: (id, body) => fetch('/api/expenses/' + id, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}),
    del: (id) => fetch('/api/expenses/' + id, {method:'DELETE'}),
    monthlyTotal: (m) => fetch('/api/expenses/monthly-total?month=' + encodeURIComponent(m)).then(r => r.json()),
    insights: (m) => fetch('/api/expenses/monthly-insights?month=' + encodeURIComponent(m)).then(r => r.json()),
    exportCsv: (q) => fetch('/api/expenses/export' + q),
    saveBudget: (body) => fetch('/api/budgets', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r=>r.json()),
    budgetProgress: (m) => fetch('/api/budgets/progress?month=' + encodeURIComponent(m)).then(r=>r.json())
  };

  function clearErrors(prefix) {
    ['Amount','Date','Category','Note'].forEach(f => {
      const el = document.getElementById(prefix + f + 'Err');
      if (el) el.textContent = '';
    });
    const fe = document.getElementById(prefix.toLowerCase() + 'FormErr');
    if (fe) fe.textContent = '';
  }

  function validateExpenseForm(amount, date, category, note, prefix) {
    clearErrors(prefix);
    let ok = true;
    if (!amount || Number(amount) <= 0) { document.getElementById(prefix+'AmountErr').textContent = 'amount must be greater than 0'; ok = false; }
    if (!date) { document.getElementById(prefix+'DateErr').textContent = 'date is required'; ok = false; }
    if (!category || category.trim().length === 0) { document.getElementById(prefix+'CategoryErr').textContent = 'category is required'; ok = false; }
    if (category && category.length > 64) { document.getElementById(prefix+'CategoryErr').textContent = 'category must be at most 64 characters'; ok = false; }
    if (note && note.length > 255) { document.getElementById(prefix+'NoteErr').textContent = 'note must be at most 255 characters'; ok = false; }
    return ok;
  }

  function qparams() {
    const p = new URLSearchParams();
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;
    const category = document.getElementById('fCategory').value;
    const minAmount = document.getElementById('minAmount').value;
    const maxAmount = document.getElementById('maxAmount').value;
    const note = document.getElementById('fNote').value;
    const sortBy = document.getElementById('sortBy').value;
    const sortOrder = document.getElementById('sortOrder').value;

    if (from) p.set('from', from);
    if (to) p.set('to', to);
    if (category) p.set('category', category);
    if (minAmount) p.set('minAmount', minAmount);
    if (maxAmount) p.set('maxAmount', maxAmount);
    if (note) p.set('note', note);
    if (sortBy) p.set('sortBy', sortBy);
    if (sortOrder) p.set('sortOrder', sortOrder);

    const s = p.toString();
    return s ? ('?' + s) : '';
  }

  async function refreshList() {
    const rows = await api.list(qparams());
    const tbody = document.getElementById('expenseTbody');
    tbody.innerHTML = '';
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.id}</td>
        <td>${r.date}</td>
        <td>${r.category}</td>
        <td>${r.amount}</td>
        <td>${r.note ?? ''}</td>
        <td class="actions">
          <button data-edit="${r.id}">Edit</button>
          <button data-del="${r.id}">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('button[data-del]').forEach(btn => {
      btn.onclick = async () => { await api.del(btn.getAttribute('data-del')); await refreshList(); };
    });
    document.querySelectorAll('button[data-edit]').forEach(btn => {
      btn.onclick = async () => {
        const id = Number(btn.getAttribute('data-edit'));
        const row = rows.find(x => x.id === id);
        openEdit(row);
      };
    });
  }

  function openEdit(row) {
    document.getElementById('editId').value = row.id;
    document.getElementById('editAmount').value = row.amount;
    document.getElementById('editDate').value = row.date;
    document.getElementById('editCategory').value = row.category;
    document.getElementById('editNote').value = row.note ?? '';
    document.getElementById('editModal').classList.remove('hidden');
  }

  document.getElementById('cancelEdit').onclick = () => {
    document.getElementById('editModal').classList.add('hidden');
  };

  document.getElementById('addBtn').onclick = async () => {
    const amount = document.getElementById('amount').value;
    const date = document.getElementById('date').value;
    const category = document.getElementById('category').value;
    const note = document.getElementById('note').value;

    if (!validateExpenseForm(amount, date, category, note, '')) return;

    const resp = await api.create({amount: Number(amount), date, category, note});
    if (!resp.ok) {
      const err = await resp.json();
      document.getElementById('addFormErr').textContent = err.message || 'Failed to add expense';
      return;
    }
    document.getElementById('amount').value='';
    document.getElementById('category').value='';
    document.getElementById('note').value='';
    await refreshList();
  };

  document.getElementById('saveEdit').onclick = async () => {
    const id = document.getElementById('editId').value;
    const amount = document.getElementById('editAmount').value;
    const date = document.getElementById('editDate').value;
    const category = document.getElementById('editCategory').value;
    const note = document.getElementById('editNote').value;

    if (!validateExpenseForm(amount, date, category, note, 'edit')) return;

    const resp = await api.update(id, {amount: Number(amount), date, category, note});
    if (!resp.ok) {
      const err = await resp.json();
      document.getElementById('editFormErr').textContent = err.message || 'Failed to update expense';
      return;
    }
    document.getElementById('editModal').classList.add('hidden');
    await refreshList();
  };

  document.getElementById('applyFilters').onclick = refreshList;
  document.getElementById('clearFilters').onclick = async () => {
    ['from','to','fCategory','minAmount','maxAmount','fNote'].forEach(id => document.getElementById(id).value='');
    document.getElementById('sortBy').value='date';
    document.getElementById('sortOrder').value='desc';
    await refreshList();
  };

  document.getElementById('exportCsv').onclick = async () => {
    const r = await api.exportCsv(qparams());
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'expenses.csv';
    a.click();
    URL.revokeObjectURL(url);
  };

  document.getElementById('loadMonthly').onclick = async () => {
    const m = document.getElementById('month').value;
    const r = await api.monthlyTotal(m);
    document.getElementById('monthlyTotal').textContent = `Monthly total for ${r.month}: ${r.total}`;
  };

  document.getElementById('loadInsights').onclick = async () => {
    const m = document.getElementById('month').value;
    const r = await api.insights(m);
    const div = document.getElementById('insights');
    if (!r.categories || r.categories.length === 0) {
      div.textContent = 'No expenses for this month.';
      return;
    }
    let html = `<div><b>Total:</b> ${r.total}</div>`;
    html += '<table><tr><th>Category</th><th>Total</th><th>%</th></tr>';
    r.categories.forEach(c => {
      html += `<tr><td><a href="#" data-drill="${c.category}">${c.category}</a></td><td>${c.total}</td><td>${c.percentage}%</td></tr>`;
    });
    html += '</table>';
    html += '<div style="margin-top:8px;"><b>Bar chart (text)</b><br/>';
    const max = Math.max(...r.categories.map(x => Number(x.total)));
    r.categories.forEach(c => {
      const bars = Math.round((Number(c.total) / max) * 20);
      html += `${c.category}: <span style="font-family: monospace;">${'█'.repeat(bars)}</span> ${c.total}<br/>`;
    });
    html += '</div>';
    div.innerHTML = html;

    document.querySelectorAll('a[data-drill]').forEach(a => {
      a.onclick = async (e) => {
        e.preventDefault();
        const cat = a.getAttribute('data-drill');
        const ym = document.getElementById('month').value;
        const first = ym + '-01';
        const last = ym + '-' + new Date(ym + '-01').toISOString().slice(0,7) === ym ? new Date(new Date(ym + '-01').getFullYear(), new Date(ym + '-01').getMonth()+1, 0).getDate() : 28;
        document.getElementById('from').value = first;
        document.getElementById('to').value = ym + '-' + String(new Date(new Date(ym + '-01').getFullYear(), new Date(ym + '-01').getMonth()+1, 0).getDate()).padStart(2,'0');
        document.getElementById('fCategory').value = cat;
        await refreshList();
        window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
      };
    });
  };

  document.getElementById('saveBudget').onclick = async () => {
    const month = document.getElementById('bMonth').value;
    const category = document.getElementById('bCategory').value;
    const amount = document.getElementById('bAmount').value;
    const r = await api.saveBudget({month, category: category || null, amount: Number(amount)});
    document.getElementById('budgetResult').textContent = `Saved budget id=${r.id} month=${r.month} category=${r.category ?? '(overall)'} amount=${r.amount}`;
  };

  document.getElementById('loadBudgetProgress').onclick = async () => {
    const month = document.getElementById('bMonth').value;
    const r = await api.budgetProgress(month);
    let html = `<div><b>Overall status:</b> ${r.overallStatus} | spent ${r.overallSpent} / budget ${r.overallBudget ?? 'N/A'}</div>`;
    if (r.categories && r.categories.length > 0) {
      html += '<table><tr><th>Category</th><th>Status</th><th>Spent</th><th>Budget</th><th>Remaining</th></tr>';
      r.categories.forEach(c => {
        html += `<tr><td>${c.category}</td><td>${c.status}</td><td>${c.spent}</td><td>${c.budget}</td><td>${c.remaining}</td></tr>`;
      });
      html += '</table>';
    } else {
      html += '<div>No category budgets configured.</div>';
    }
    document.getElementById('budgetProgress').innerHTML = html;
  };

  refreshList();
</script>
</body>
</html>
