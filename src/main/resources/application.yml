server:
  port: 8080

spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
